name: NSE Pro Intraday Scanner

on:
  schedule:
    # Runs every 15 mins Monday-Friday between 3:45 UTC & 10:00 UTC (9:15 AM - 3:30 PM IST)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests

    - name: Execute Intraday Scanner Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python scanner_intraday.py

    - name: Commit and Push Updated Signals JSON
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add signals.json
        git diff --staged --quiet || git commit -m "Auto-update signals.json [skip ci]"
        git push
