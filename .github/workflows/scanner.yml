name: Swing Scanner EOD

on:
  schedule:
    # 4:15 PM IST = 10:45 AM UTC
    - cron: '45 10 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance requests pytz pandas numpy

      - name: Show repository files
        run: |
          pwd
          ls -la

      - name: Run Swing Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
          RISK_PERCENT: ${{ secrets.RISK_PERCENT }}
          MAX_INVESTMENT: ${{ secrets.MAX_INVESTMENT }}
        run: python scanner_swing.py

      - name: Commit signals.json
        run: |
          git config --global user.name "Scanner Bot"
          git config --global user.email "bot@scanner.com"

          git pull --rebase origin main || true

          git add signals.json

          if ! git diff --staged --quiet; then
            git commit -m "EOD swing scan [auto]"
            git push
          fi
